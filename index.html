  :root {
    --navy: #172a3f;
    --navy-dark: #0e1b2a;
    --amber: #f4a93a;
    --teal: #1fa594;
    --cream: #faf7f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--cream);
    color: var(--navy);
  }
  .hero {
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: white;
    text-align: center;
    padding: 48px 24px 60px;
  }
  .hero h1 {
    margin: 0 0 6px;
    font-size: 30px;
  }
  .hero p.subtitle {
    margin: 0 0 32px;
    color: #cfd8e3;
    font-size: 16px;
  }
  .whatsapp-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: #25D366;
    color: white;
    text-decoration: none;
    font-weight: 700;
    font-size: 22px;
    padding: 20px 36px;
    border-radius: 50px;
    box-shadow: 0 8px 24px rgba(37, 211, 102, 0.35);
    transition: transform 0.15s ease;
  }
  .whatsapp-btn:active { transform: scale(0.97); }
  .whatsapp-btn svg { width: 28px; height: 28px; }
  .section {
    max-width: 480px;
    margin: 0 auto;
    padding: 44px 24px 60px;
    text-align: center;
  }
  .soon-tag {
    display: block;
    color: #9aa8b8;
    font-size: 15px;
    margin-bottom: 14px;
    text-align: center;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }
  .text-block {
    text-align: center;
    flex: 1.4;
    min-width: 0;
  }
  .phrase-1 {
    font-family: 'Sriracha', cursive;
    font-size: 28px;
    color: var(--navy);
    margin: 0;
    line-height: 1.25;
    white-space: nowrap;
  }
  .phrase-2 {
    font-family: 'Sriracha', cursive;
    font-size: 21px;
    color: var(--amber);
    margin: 0;
    line-height: 1.25;
    white-space: nowrap;
  }
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .logo-card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }
  .logo-card img {
    width: 100%;
    max-width: 360px;
    display: block;
    margin: 0 auto;
  }
  .logo-card img.icon-only {
    max-width: 130px;
  }
  footer {
    text-align: center;
    padding: 24px;
    color: #999;
    font-size: 13px;
  }
  .brand-title {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 44px;
    font-weight: 800;
    color: var(--navy);
    margin: 0 0 8px;
  }
  .tagline {
    font-size: 19px;
    font-weight: 700;
    color: var(--teal);
    margin: 0 0 14px;
  }
  .description {
    font-size: 15px;
    color: #666;
    line-height: 1.55;
    margin: 0 0 30px;
  }
  @media (max-width: 380px) {
    .section { padding-left: 14px; padding-right: 14px; }
    .row { gap: 10px; }
    .avatar { width: 96px; height: 96px; }
    .phrase-1 { font-size: 22px; }
    .phrase-2 { font-size: 16px; }
  }
</style>
